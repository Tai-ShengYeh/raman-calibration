<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Raman spectroscopy laboratory illustration</title><desc id="d">Stylized Raman microscope, red laser, sample vial and spectral peaks.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset=".52" stop-color="#0b3659"/><stop offset="1" stop-color="#11132d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff475f" stop-opacity=".9"/><stop offset="1" stop-color="#ff475f" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#182439"/><stop offset=".28" stop-color="#77889d"/><stop offset=".5" stop-color="#263448"/><stop offset=".8" stop-color="#aeb8c5"/><stop offset="1" stop-color="#172236"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".22" fill="#73b9dc"><circle cx="1300" cy="170" r="150" filter="url(#blur)"/><circle cx="1110" cy="730" r="210" filter="url(#blur)"/></g>
<g opacity=".13" stroke="#b7dcff"><path d="M0 690H1600M0 760H1600M0 830H1600"/><path d="M980 0V900M1100 0V900M1220 0V900M1340 0V900M1460 0V900"/></g>
<!-- microscope objective -->
<g transform="translate(870 30)"><rect x="0" y="0" width="250" height="235" rx="28" fill="url(#metal)"/><path d="M35 220h180l-28 105H63z" fill="#111a29"/><rect x="75" y="305" width="100" height="72" rx="18" fill="url(#metal)"/></g>
<!-- laser -->
<rect x="992" y="395" width="5" height="270" fill="#ff3248"/><rect x="987" y="395" width="15" height="270" fill="#ff3248" opacity=".28" filter="url(#blur)"/>
<ellipse cx="995" cy="670" rx="165" ry="105" fill="url(#glow)" opacity=".6"/>
<!-- sample stage -->
<ellipse cx="995" cy="705" rx="205" ry="62" fill="#202c3e"/><rect x="790" y="705" width="410" height="72" fill="#162235"/><ellipse cx="995" cy="777" rx="205" ry="62" fill="#0c1524"/>
<ellipse cx="995" cy="690" rx="88" ry="24" fill="#f6a6ad" opacity=".58"/><ellipse cx="995" cy="684" rx="44" ry="14" fill="#fff" opacity=".65"/>
<!-- spectrum panel -->
<g transform="translate(1130 200)"><rect x="0" y="0" width="390" height="290" rx="24" fill="#071626" fill-opacity=".54" stroke="#8dc9ef" stroke-opacity=".35"/><path d="M36 240H360M36 50V240" stroke="#9eb9cf" stroke-opacity=".5"/><path d="M40 225 L75 218 L105 210 L130 222 L152 190 L174 204 L198 112 L220 210 L244 174 L268 198 L290 70 L310 202 L336 145 L358 220" fill="none" stroke="#51c8ff" stroke-width="5"/><path d="M40 232 L86 226 L126 229 L154 212 L178 226 L204 180 L228 225 L256 216 L282 228 L304 170 L330 218 L358 226" fill="none" stroke="#ffb844" stroke-width="4"/><text x="35" y="34" fill="#eaf6ff" font-family="sans-serif" font-size="21">Raman spectrum</text><text x="234" y="272" fill="#a9c2d8" font-family="sans-serif" font-size="16">Raman shift (cm⁻¹)</text></g>
<!-- vials -->
<g transform="translate(1120 610)"><g transform="translate(0 0)"><rect x="0" y="45" width="72" height="155" rx="16" fill="#1e9bff" fill-opacity=".42" stroke="#91d8ff"/><rect x="7" y="0" width="58" height="58" rx="10" fill="#111723"/></g><g transform="translate(82 15)"><rect x="0" y="45" width="72" height="140" rx="16" fill="#5dd47e" fill-opacity=".45" stroke="#bbffca"/><rect x="7" y="0" width="58" height="58" rx="10" fill="#111723"/></g><g transform="translate(164 5)"><rect x="0" y="45" width="72" height="150" rx="16" fill="#ffd84e" fill-opacity=".48" stroke="#fff0a3"/><rect x="7" y="0" width="58" height="58" rx="10" fill="#111723"/></g><g transform="translate(246 22)"><rect x="0" y="45" width="72" height="133" rx="16" fill="#ff784e" fill-opacity=".5" stroke="#ffb39e"/><rect x="7" y="0" width="58" height="58" rx="10" fill="#111723"/></g></g>
<g fill="#fff" opacity=".8" font-family="sans-serif"><text x="1180" y="545" font-size="24">same spectra.</text><text x="1250" y="578" font-size="30" font-weight="700">better answers.</text></g>
</svg>